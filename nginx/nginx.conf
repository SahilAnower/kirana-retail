worker_processes auto;             # Automatically set worker processes based on available CPUs
worker_rlimit_nofile 100000;       # Maximum number of open file descriptors

events {
    worker_connections 65535;      # Maximum number of connections per worker
    multi_accept on;               # Accept multiple new connections at once
    use epoll;                     # Use epoll for high-performance event handling (Linux-specific)
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Optimize timeouts for high concurrency
    keepalive_timeout 65;          # Keep connections alive for 65 seconds
    sendfile on;                   # Enable efficient file transfers
    tcp_nopush on;                 # Optimize for sending large files
    tcp_nodelay on;                # Minimize latency for small responses

    # Buffer sizes to handle large headers and responses
    client_body_buffer_size 128k;
    client_header_buffer_size 64k;
    large_client_header_buffers 4 64k;
    output_buffers 4 128k;
    postpone_output 1460;

    # Enable Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Set connection limits
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_conn conn_limit 100;

    # Include server-specific configurations
    include /etc/nginx/conf.d/*.conf;
}
