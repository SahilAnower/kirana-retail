upstream app_servers {
    server kirana1:5000 max_fails=3 fail_timeout=30s;
    server kirana2:5000 max_fails=3 fail_timeout=30s;
    server kirana3:5000 max_fails=3 fail_timeout=30s;
    keepalive 64;  # Increase keepalive connections for upstream servers
}

server {
    listen 80;

    location / {
        proxy_pass http://app_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout and buffer adjustments for backend
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;
        proxy_temp_file_write_size 128k;
    }

    location /health {
        return 200 "OK";
    }
}
